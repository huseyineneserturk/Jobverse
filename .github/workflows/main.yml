name: Haftalik Jobverse Analizi

on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # DÜZELTME 1: requirements.txt dosyasının tam yolunu verdik
      # Tırnak işaretleri önemli çünkü klasör adında boşluk var.
      - name: Kutuphaneleri Yukle
        run: |
          pip install -r "Jobverse Automated/requirements.txt"

      # DÜZELTME 2: Python dosyasının yeni adını ve tam yolunu verdik
      - name: Analizi Calistir
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
        run: python "Jobverse Automated/main_analysis_github.py"
